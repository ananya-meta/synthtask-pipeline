[project]
name = "ideation"
version = "0.1.0"
description = "Ideation pipeline: research papers -> deduped, scored, human-gated task ideas"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ideation = "ideation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ideation"]
